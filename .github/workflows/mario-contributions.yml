name: Mario contribution graph

on:
  schedule:
    - cron: "0 0 * * *" # every day at 00:00 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate-mario.mjs
      - .github/workflows/mario-contributions.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate SVGs
        env:
          # Optional: add a GH_PAT secret (read:user scope) to include private contributions
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: node scripts/generate-mario.mjs "${{ github.repository_owner }}" dist

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git diff --cached --quiet || git commit -m "chore: update Mario contribution graph"
          git push
